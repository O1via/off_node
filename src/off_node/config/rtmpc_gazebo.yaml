# RTMPC Gazebo node parameters (ROS1 private namespace)

# Loop
rate_hz: 10.0
dt: 0.1
horizon: 30

# Offboard / heading
auto_offboard_arm: true
start_delay_sec: 1.0
yaw_deg: 90.0

# Controller mode. Use rtmpc for expert/QP control, policy for the DAgger neural policy.
controller_mode: rtmpc
policy_checkpoint_path: /home/zxy/work/dagger_runs/policy_cycle_08.pt
policy_device: cpu
policy_torch_site: /home/zxy/work/.venv/lib/python3.8/site-packages

# Full reference task: takeoff/entry segment + circle segment
# NED: [pn, pe, pd]. This must match SITL spawn ENU [x=pe, y=pn, z=-pd].
takeoff_start_ned: [0.0, 0.0, 0.0]
entry_steps: 120
reference_altitude_m: 2.0
circle_radius: 4.0
circle_period_steps: 126
clockwise: true
tracking_profile: high_speed_extension

# Takeoff/entry QP objective scaling. Circle tracking still uses nominal weights.
entry_q_scale: 0.5
entry_r_scale: 2.5

# Disturbance / tube design bound
disturbance_mode: force_only
force_bound_mg: 0.0
force_d_axis_scale: 0.15

# Optional physical disturbance injection in Gazebo. Disabled by default so
# force_bound_mg can be tested as a controller-design bound independently.
disturbance_apply_enable: false
disturbance_apply_only_circle: true
disturbance_apply_force_bound_mg: 0.1  # <0 means reuse force_bound_mg
disturbance_events_per_circle: 2  # short gusts per circular lap, near 1/4 and 3/4 lap
disturbance_duration_sec: 0.5   # duration of each gust event
# random: sample a bounded random force; fixed_ned: apply force_bound_mg along disturbance_force_direction_ned.
disturbance_direction_mode: fixed_ned
disturbance_force_direction_ned: [0.0, 1.0, 0.0]  # NED [n,e,d], used when mode=fixed_ned
disturbance_seed: 1
disturbance_body_name: iris::base_link
disturbance_reference_frame: world
disturbance_log_hz: 1.0

# GP. Keep false until the no-GP full-reference RTMPC is stable in Gazebo.
use_gp: false
gp_model_path: /home/zxy/work/gp_model/iris_linear_residual_gp.npz
gp_beta_sigma: 1.0
gp_shrink_mode: residual
gp_stagewise_refine_steps: 1
gp_grid_points_per_dim: 9

# Vehicle / mapping
mass_kg: 1.5
g: 9.81
hover_thrust_norm: 0.705
thrust_to_dT_scale: -1.0

# Output command slew-rate limit. u_* in CSV is the sent command; u_raw_* is before slew limiting.
command_slew_enable: true
max_dT_rate_nps: 10.0
max_phi_rate_radps: 0.30
max_theta_rate_radps: 0.30

# Sign tuning
state_roll_sign: 1.0
state_pitch_sign: 1.0
cmd_roll_sign: 1.0
cmd_pitch_sign: 1.0

# Topics
pose_topic: mavros/local_position/pose
vel_topic: mavros/local_position/velocity_local
state_topic: mavros/state
att_sp_topic: mavros/setpoint_raw/attitude

# Diagnostics
diag_enable: true
diag_csv_path: /home/zxy/off_node/src/off_node/diag_outputs/rtmpc_diag.csv
diag_log_hz: 10.0
