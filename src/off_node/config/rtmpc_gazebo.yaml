# RTMPC Gazebo node parameters (ROS1 private namespace)

# Loop
rate_hz: 10.0
dt: 0.1
horizon: 30

# Offboard / heading
auto_offboard_arm: true
yaw_deg: 90.0

# Circle task
circle_radius: 4.0
circle_period_steps: 126
clockwise: true
ref_pd: -1.0
tracking_profile: high_speed_extension

# Pre-align stage before RTMPC starts
pre_align_enable: true
pre_align_hover_sec: 10.0
pre_align_pos_tol_m: 0.2
pre_align_vel_tol_mps: 0.2
pre_align_kp_pos_xy: 0.3
pre_align_kd_vel_xy: 0.4
pre_align_kp_pos_d: 0.2
pre_align_kd_vel_d: 0.45
pre_align_max_tilt_deg: 12.0
pre_align_timeout_sec: 120.0
pre_align_force_start_on_timeout: false

# Line-entry stage: hover at staging point then fly straight to circle start with target speed
line_entry_enable: true
line_entry_staging_offset_m: 4.0
line_entry_hold_sec: 0.1
line_entry_timeout_sec: 30.0
line_entry_force_start_on_timeout: false
line_entry_pos_tol_n_m: 0.3
line_entry_pos_tol_e_m: 0.3
line_entry_pos_tol_d_m: 0.12
line_entry_vel_tol_n_mps: 0.30
line_entry_vel_tol_e_mps: 0.30
line_entry_vel_tol_d_mps: 0.30
line_entry_att_tol_rad: 0.20

# Line-entry controller gains (independent from pre_align gains)
line_entry_kp_pos_xy: 0.3
line_entry_kd_vel_xy: 0.8
line_entry_kp_pos_d: 0.20
line_entry_kd_vel_d: 0.5
line_entry_max_tilt_deg: 10.0
line_entry_require_qp_feasible: true
line_entry_qp_feasible_eps: 1.0e-6

# Disturbance / tube
disturbance_mode: force_only
force_bound_mg: 0.05
force_d_axis_scale: 0.15

# GP
use_gp: false
gp_model_path: /home/zxy/work/gp_model/iris_linear_residual_gp.npz
gp_beta_sigma: 1.0
gp_shrink_mode: residual
gp_stagewise_refine_steps: 1
gp_grid_points_per_dim: 9

# Vehicle / mapping
mass_kg: 1.5
g: 9.81
hover_thrust_norm: 0.705
thrust_to_dT_scale: -1.0

# Sign tuning
state_roll_sign: 1.0
state_pitch_sign: 1.0
cmd_roll_sign: 1.0
cmd_pitch_sign: 1.0

# Topics
pose_topic: mavros/local_position/pose
vel_topic: mavros/local_position/velocity_local
state_topic: mavros/state
att_sp_topic: mavros/setpoint_raw/attitude

# Diagnostics
# write phase switch diagnostics to CSV for offline plotting
# (line_entry criteria: pos/vel/att/hold)
diag_enable: true
diag_csv_path: /home/zxy/off_node/src/off_node/diag_outputs/rtmpc_diag.csv
diag_log_hz: 10.0
